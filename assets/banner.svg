<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#9b5de5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#415a77" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 12px; opacity: 0.8; }
      50% { r: 42px; opacity: 0.1; }
      100% { r: 12px; opacity: 0.8; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    .pulsing-wave-1 {
      animation: pulseRing 3.5s infinite ease-in-out;
    }
    .pulsing-wave-2 {
      animation: pulseRing 4.2s infinite ease-in-out 1s;
    }
    .flight-path {
      stroke-dasharray: 8, 8;
      animation: dashMove 12s linear infinite;
    }
    .floating-card-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatPill2 6s ease-in-out infinite 0.5s;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Map Network Elements (in background / periphery) -->
  <g opacity="0.45">
    <!-- Connecting Curved Coordinate Rays -->
    <path class="flight-path" d="M 80 80 Q 300 20 500 120 T 950 80" fill="none" stroke="#00f5d4" stroke-width="1.8" />
    <path class="flight-path" d="M 120 300 Q 400 340 700 260 T 1120 280" fill="none" stroke="#00bbf9" stroke-width="1.8" />
    <path class="flight-path" d="M 850 60 Q 1050 160 1150 320" fill="none" stroke="#9b5de5" stroke-width="1.5" />

    <!-- Pulse Rings around coordinate nodes -->
    <circle cx="80" cy="80" r="12" fill="none" stroke="#00f5d4" stroke-width="2" class="pulsing-wave-1" />
    <circle cx="80" cy="80" r="4" fill="#00f5d4" />

    <circle cx="950" cy="80" r="15" fill="none" stroke="#00bbf9" stroke-width="2" class="pulsing-wave-2" />
    <circle cx="950" cy="80" r="5" fill="#00bbf9" />

    <circle cx="1120" cy="280" r="14" fill="none" stroke="#9b5de5" stroke-width="2" class="pulsing-wave-1" />
    <circle cx="1120" cy="280" r="4.5" fill="#9b5de5" />

    <circle cx="120" cy="300" r="10" fill="none" stroke="#00f5d4" stroke-width="1.5" class="pulsing-wave-2" />
    <circle cx="120" cy="300" r="3.5" fill="#00f5d4" />
  </g>

  <!-- Decorative Floated Badges / Tech Indicators (Far corners) -->
  <g class="floating-card-1">
    <g transform="translate(980, 40)" filter="url(#shadow)">
      <rect width="180" height="42" rx="21" fill="#1b263b" stroke="#00f5d4" stroke-width="1.5" opacity="0.95" />
      <circle cx="22" cy="21" r="7" fill="#00f5d4" />
      <text x="38" y="26" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">WebGL &amp; 3D Tiles</text>
    </g>
  </g>

  <g class="floating-card-2">
    <g transform="translate(970, 275)" filter="url(#shadow)">
      <rect width="190" height="42" rx="21" fill="#1b263b" stroke="#9b5de5" stroke-width="1.5" opacity="0.95" />
      <circle cx="22" cy="21" r="7" fill="#9b5de5" />
      <text x="38" y="26" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Spatial Analytics</text>
    </g>
  </g>

  <g class="floating-card-1">
    <g transform="translate(45, 275)" filter="url(#shadow)">
      <rect width="170" height="42" rx="21" fill="#1b263b" stroke="#00bbf9" stroke-width="1.5" opacity="0.95" />
      <circle cx="22" cy="21" r="7" fill="#00bbf9" />
      <text x="38" y="26" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Vector Tiles &amp; GIS</text>
    </g>
  </g>

  <!-- FOREGROUND: Header & Typography (Guaranteed Unobscured) -->
  <!-- Top Category Chip -->
  <g transform="translate(475, 52)">
    <rect width="250" height="32" rx="16" fill="#0d1b2a" stroke="#00bbf9" stroke-width="1.2" opacity="0.9" />
    <text x="125" y="21" fill="#00f5d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">GEO • WEB-GIS • MAPS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#glowGrad)" letter-spacing="-0.5" filter="url(#shadow)">Awesome Mapping &amp; GIS Libraries</text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e0e1dd" letter-spacing="0.2">A Curated Catalog of Web Map Rendering, Spatial Analysis &amp; Tile Infrastructure</text>

  <!-- Supporting Highlights -->
  <text x="600" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#778da9" letter-spacing="0.5">SaaS APIs • Open-Source JavaScript &amp; Python Engines • 3D Globes • Cloud Basemaps</text>
</svg>
